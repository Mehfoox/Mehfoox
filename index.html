<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Scores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 600px;
        }
        h1 {
            color: #3d3d3d;
        }
        #scoreboard {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
        .match {
            margin: 10px 0;
            padding: 10px;
            background-color: #e8e8e8;
            border-radius: 5px;
        }
        .match p {
            margin: 5px 0;
        }
        .loading {
            font-size: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Live Cricket Scores</h1>
        <div id="scoreboard">
            <div class="loading">Loading live scores...</div>
        </div>
    </div>

    <script>
        // Replace with your own CricAPI key
        const apiKey = 'bc32eef6-fdf2-481d-a1c2-403512e18aad';
        const url = `https://cricapi.com/api/matches?apikey=${apiKey}`;

        // Function to fetch live match data
        async function fetchLiveScores() {
            try {
                const response = await fetch(url);
                const data = await response.json();

                // Check if matches are available
                if (data.matches && data.matches.length > 0) {
                    const matchData = data.matches.map(match => {
                        return `
                            <div class="match">
                                <p><strong>${match.team1}</strong> vs <strong>${match.team2}</strong></p>
                                <p>Status: ${match.status}</p>
                                <p>Score: ${match.score}</p>
                            </div>
                        `;
                    }).join('');
                    
                    document.getElementById('scoreboard').innerHTML = matchData;
                } else {
                    document.getElementById('scoreboard').innerHTML = '<p>No live matches currently.</p>';
                }
            } catch (error) {
                document.getElementById('scoreboard').innerHTML = '<p>Error fetching live scores. Please try again later.</p>';
            }
        }

        // Fetch the live scores when the page loads
        fetchLiveScores();

        // Refresh scores every 30 seconds
        setInterval(fetchLiveScores, 30000);
    </script>
</body>
</html>
