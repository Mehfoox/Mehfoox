<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live & Past Cricket Scores</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Reset default styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f3f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .loading {
            font-size: 18px;
            color: #888;
            font-style: italic;
        }

        #scoreboard {
            margin-top: 20px;
            display: grid;
            gap: 15px;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto;
        }

        @media (max-width: 768px) {
            #scoreboard {
                grid-template-columns: 1fr;
            }
        }

        .match {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .match:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .match-header {
            font-size: 18px;
            font-weight: 500;
            color: #34495e;
            margin-bottom: 8px;
        }

        .match-status {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }

        .match-score {
            font-size: 18px;
            font-weight: 600;
            color: #27ae60;
        }

        .match-completed .match-score {
            color: #e74c3c;
        }

        .match-in-progress .match-score {
            color: #f39c12;
        }

        .match-pending .match-score {
            color: #3498db;
        }

        .error-message {
            color: #e74c3c;
            font-size: 18px;
        }

        .section-title {
            font-size: 24px;
            color: #2c3e50;
            margin-top: 40px;
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Live & Past Cricket Scores</h1>

    <!-- Section for live scores -->
    <div class="section-title">Live Matches</div>
    <div id="live-scores">
        <div class="loading">Fetching live scores...</div>
    </div>

    <!-- Section for past matches -->
    <div class="section-title">Past Matches</div>
    <div id="past-scores">
        <div class="loading">Fetching past match results...</div>
    </div>
</div>

<script>
    // Replace with your own CricAPI key
    const apiKey = 'bc32eef6-fdf2-481d-a1c2-403512e18aad';
    const liveMatchesUrl = `https://cricapi.com/api/matches?apikey=${apiKey}&status=LIVE`; // Fetch live matches
    const pastMatchesUrl = `https://cricapi.com/api/matches?apikey=${apiKey}&status=COMPLETED`; // Fetch completed matches

    // Function to fetch match data
    async function fetchMatchData(url, containerId) {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Failed to fetch data from API. Status: ${response.status}`);
            }
            const data = await response.json();
            
            // Log API response for debugging
            console.log('API Response:', data);

            // Check if matches are available
            if (data.matches && data.matches.length > 0) {
                const matchData = data.matches.map(match => {
                    let matchStatusClass = 'match-pending'; // Default status

                    if (match.status === 'Match completed') {
                        matchStatusClass = 'match-completed';
                    } else if (match.status === 'In progress') {
                        matchStatusClass = 'match-in-progress';
                    }

                    return `
                        <div class="match ${matchStatusClass}">
                            <div class="match-header">
                                <strong>${match.team1}</strong> vs <strong>${match.team2}</strong>
                            </div>
                            <div class="match-status">${match.status}</div>
                            <div class="match-score">${match.score || 'No score available'}</div>
                        </div>
                    `;
                }).join('');
                
                document.getElementById(containerId).innerHTML = matchData;
            } else {
                document.getElementById(containerId).innerHTML = '<p class="error-message">No matches found.</p>';
            }
        } catch (error) {
            console.error('Error fetching match data:', error); // Log error to console
            document.getElementById(containerId).innerHTML = '<p class="error-message">Error fetching match data. Please try again later.</p>';
        }
    }

    // Fetch live and past match data
    fetchMatchData(liveMatchesUrl, 'live-scores');
    fetchMatchData(pastMatchesUrl, 'past-scores');

    // Refresh scores every 30 seconds
    setInterval(() => {
        fetchMatchData(liveMatchesUrl, 'live-scores');
        fetchMatchData(pastMatchesUrl, 'past-scores');
    }, 30000);
</script>

</body>
</html>
